<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZONO.CLUB</title>
    <!-- Tailwind CSS (via CDN agar langsung jalan tanpa instalasi) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d0e12;
            color: #ffffff;
        }
        /* Glow Effect Custom */
        .glow-effect {
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.4);
        }
        .glow-effect:hover {
            box-shadow: 0 0 35px rgba(99, 102, 241, 0.7);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center relative overflow-x-hidden">

    <!-- Background Decoration Gradient -->
    <div class="absolute top-[-10%] left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-indigo-600/20 blur-[120px] rounded-full -z-10 pointer-events-none"></div>

    <!-- Header / Navbar -->
    <header class="w-full max-w-5xl mx-auto p-6 flex justify-between items-center">
        <div class="text-2xl font-extrabold tracking-wider bg-gradient-to-r from-indigo-400 to-purple-500 bg-clip-text text-transparent">
            ZONO<span class="text-white">.CLUB</span>
        </div>
        <a href="#links" class="text-sm font-semibold text-gray-400 hover:text-white transition">
            Community <i class="fa-solid font-xs fa-arrow-up-right-from-square ml-1"></i>
        </a>
    </header>

    <!-- Hero Section -->
    <main class="w-full max-w-md px-6 my-auto text-center flex flex-col items-center">
        
        <!-- Avatar / Logo Sub-brand -->
        <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 p-1 mb-6 glow-effect transition duration-300">
            <div class="w-full h-full bg-[#121318] rounded-full flex items-center justify-center">
                <i class="fa-solid fa-bolt text-3xl text-indigo-400"></i>
            </div>
        </div>

        <!-- Title & Bio -->
        <h1 class="text-3xl font-extrabold tracking-tight mb-2">Welcome to ZONO</h1>
        <p class="text-gray-400 text-sm mb-8">
            Your ultimate hub for tools, links, and exclusive digital experience. Join the movement.
        </p>

        <!-- Link Buttons Stack (Gaya Bio Link ZONO) -->
        <div id="links" class="w-full flex flex-col gap-4">

            <!-- Link 1 -->
            <a href="https://discord.gg" target="_blank" class="w-full py-3.5 px-6 rounded-xl bg-[#161821] hover:bg-[#1e212d] border border-gray-800 hover:border-indigo-500/50 flex items-center justify-between group transition-all duration-300">
                <div class="flex items-center gap-3">
                    <i class="fa-brands fa-discord text-xl text-indigo-400"></i>
                    <span class="font-semibold text-sm">Discord Community</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-gray-500 group-hover:translate-x-1 transition-transform"></i>
            </a>

            <!-- Link 2 -->
            <a href="https://telegram.org" target="_blank" class="w-full py-3.5 px-6 rounded-xl bg-[#161821] hover:bg-[#1e212d] border border-gray-800 hover:border-indigo-500/50 flex items-center justify-between group transition-all duration-300">
                <div class="flex items-center gap-3">
                    <i class="fa-brands fa-telegram text-xl text-sky-400"></i>
                    <span class="font-semibold text-sm">Official Telegram</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-gray-500 group-hover:translate-x-1 transition-transform"></i>
            </a>

            <!-- Link 3 (Featured Highlighting) -->
            <a href="#" class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:opacity-90 flex items-center justify-between group glow-effect transition-all duration-300">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-crown text-xl text-yellow-300"></i>
                    <span class="font-bold text-sm text-white">VIP Access</span>
                </div>
                <i class="fa-solid fa-arrow-right text-xs text-white group-hover:translate-x-1 transition-transform"></i>
            </a>

            <!-- Link 4 -->
            <a href="https://github.com" target="_blank" class="w-full py-3.5 px-6 rounded-xl bg-[#161821] hover:bg-[#1e212d] border border-gray-800 hover:border-indigo-500/50 flex items-center justify-between group transition-all duration-300">
                <div class="flex items-center gap-3">
                    <i class="fa-brands fa-github text-xl text-gray-300"></i>
                    <span class="font-semibold text-sm">Open Source Repository</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-gray-500 group-hover:translate-x-1 transition-transform"></i>
            </a>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full p-6 text-center text-xs text-gray-600">
        &copy; <script>document.write(new Date().getFullYear())</script> ZONO.CLUB. All rights reserved.
    </footer>

</body>
</html>
