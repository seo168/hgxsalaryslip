<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>XX7 Monitoring Dashboard V2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, sans-serif; background:#0f172a; color:#e5e7eb; }
    header { padding:18px 20px; background:#111827; position:sticky; top:0; z-index:10; border-bottom:1px solid #334155; }
    h1 { margin:0; font-size:24px; }
    .sub { color:#9ca3af; margin-top:6px; display:flex; gap:18px; flex-wrap:wrap; }
    .pill { background:#1e293b; padding:6px 10px; border-radius:999px; }
    .platforms { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .platform { padding:7px 12px; border-radius:10px; background:#334155; color:#cbd5e1; font-weight:bold; }
    .platform.active { background:#2563eb; color:white; }
    .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; padding:20px; }
    .card { background:#1e293b; border-radius:16px; padding:16px; box-shadow:0 8px 20px #0005; border:1px solid #334155; }
    .card h2 { margin:0 0 12px; font-size:20px; color:#93c5fd; }
    .big { font-size:30px; font-weight:bold; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; color:#cbd5e1; font-size:13px; }
    .alertCards { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; padding:0 20px 20px; }
    .alertCard { background:#281c1c; border:1px solid #7f1d1d; border-radius:16px; padding:14px; }
    .alertCard h3 { margin:0 0 8px; color:#fecaca; }
    .alertCard .name { font-size:18px; font-weight:bold; }
    section { padding:0 20px 24px; }
    .box { background:#1e293b; border-radius:16px; padding:16px; overflow:auto; border:1px solid #334155; }
    table { width:100%; border-collapse:collapse; min-width:1200px; }
    th,td { padding:9px 10px; border-bottom:1px solid #334155; text-align:center; white-space:nowrap; }
    th { background:#334155; color:#fff; position:sticky; top:0; }
    .bad { color:#f87171; font-weight:bold; }
    .good { color:#4ade80; font-weight:bold; }
    .warn { color:#facc15; font-weight:bold; }
    .tabs { padding:0 20px 16px; display:flex; gap:10px; flex-wrap:wrap; }
    button { background:#334155; color:#fff; border:0; padding:10px 16px; border-radius:10px; cursor:pointer; }
    button.active { background:#2563eb; }
    .sectionTitle { padding:0 20px 10px; margin:0; color:#e5e7eb; }
    @media(max-width:1100px){ .cards,.alertCards{grid-template-columns:1fr 1fr;} }
    @media(max-width:700px){ .cards,.alertCards{grid-template-columns:1fr;} table{min-width:900px;} }
  </style>
</head>
<body>
<header>
  <h1>XX7 Monitoring Dashboard</h1>
  <div class="sub">
    <span class="pill" id="lastUpdate">Last Update: Loading...</span>
    <span class="pill" id="nextRefresh">Next Refresh: 60s</span>
    <span class="pill" id="status">Status: Loading...</span>
  </div>
  <div class="platforms">
    <div class="platform active">XX7</div>
    <div class="platform">XX6</div>
    <div class="platform">XX5</div>
    <div class="platform">YY9</div>
    <div class="platform">YYGAME</div>
    <div class="platform">66GAME</div>
  </div>
</header>

<div class="cards" id="summaryCards"></div>

<h2 class="sectionTitle">重点告警</h2>
<div class="alertCards" id="alertCards"></div>

<div class="tabs">
  <button class="active" onclick="showTab(event,'detail')">Detail</button>
  <button onclick="showTab(event,'alert')">Alert</button>
</div>

<section id="detailBox" class="box"></section>
<section id="alertBox" class="box" style="display:none;"></section>

<script>
const SUMMARY_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSUZgk2WtmhecGB1AJsBSsI54LiBT87sMCssDvmXkzNIZNK67ho9EMSNocsSctKSWuJ4v6WenbKM_5Z/pub?gid=0&single=true&output=csv";
const DETAIL_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSUZgk2WtmhecGB1AJsBSsI54LiBT87sMCssDvmXkzNIZNK67ho9EMSNocsSctKSWuJ4v6WenbKM_5Z/pub?gid=16814199&single=true&output=csv";
const ALERT_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSUZgk2WtmhecGB1AJsBSsI54LiBT87sMCssDvmXkzNIZNK67ho9EMSNocsSctKSWuJ4v6WenbKM_5Z/pub?gid=844445321&single=true&output=csv";
const SYSTEM_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSUZgk2WtmhecGB1AJsBSsI54LiBT87sMCssDvmXkzNIZNK67ho9EMSNocsSctKSWuJ4v6WenbKM_5Z/pub?gid=696911992&single=true&output=csv";

let countdown = 60;

function parseCSV(text){
  const rows = [];
  let row = [], cell = "", quote = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], n = text[i+1];
    if(c === '"' && quote && n === '"'){ cell += '"'; i++; }
    else if(c === '"'){ quote = !quote; }
    else if(c === "," && !quote){ row.push(cell); cell = ""; }
    else if((c === "\n" || c === "\r") && !quote){
      if(cell || row.length){ row.push(cell); rows.push(row); row=[]; cell=""; }
      if(c === "\r" && n === "\n") i++;
    } else cell += c;
  }
  if(cell || row.length){ row.push(cell); rows.push(row); }
  const headers = rows.shift() || [];
  return rows.map(r => Object.fromEntries(headers.map((h,i)=>[h.trim(), (r[i]||"").trim()])));
}

async function loadCSV(url){
  const res = await fetch(url + "&t=" + Date.now());
  return parseCSV(await res.text());
}

function pctNum(v){ return parseFloat(String(v || "0").replace("%","")) || 0; }

function rateClass(v){
  const n = pctNum(v);
  if(n < 35) return "bad";
  if(n >= 50) return "good";
  return "warn";
}

function makeCards(rows){
  document.getElementById("summaryCards").innerHTML = rows.map(r => `
    <div class="card">
      <h2>${r["窗口"]}</h2>
      <div class="big ${rateClass(r["成功率"])}">${r["成功率"]}</div>
      <div class="grid">
        <div>总金额<br><b>${r["总金额"]}</b></div>
        <div>成功金额<br><b>${r["充值成功金额"]}</b></div>
        <div>总笔数<br><b>${r["总笔数"]}</b></div>
        <div>成功笔数<br><b>${r["充值成功笔数"]}</b></div>
      </div>
    </div>
  `).join("");
}

function makeAlertCards(rows){
  const sorted = [...rows].sort((a,b)=>pctNum(a["成功率"]) - pctNum(b["成功率"])).slice(0,3);
  if(!sorted.length){
    document.getElementById("alertCards").innerHTML = `
      <div class="alertCard"><h3>✅ 暂无告警</h3><div>当前没有重点问题</div></div>
    `;
    return;
  }
  document.getElementById("alertCards").innerHTML = sorted.map(r => `
    <div class="alertCard">
      <h3>⚠ ${r["备注"] || "Alert"}</h3>
      <div class="name">${r["三方"]}</div>
      <div>窗口: <b>${r["窗口"]}</b></div>
      <div>成功率: <b class="${rateClass(r["成功率"])}">${r["成功率"]}</b></div>
      <div>订单比例: <b>${r["订单比例"]}</b> / 权重比例: <b>${r["权重比例"]}</b></div>
    </div>
  `).join("");
}

function renderTable(id, rows){
  if(!rows.length){
    document.getElementById(id).innerHTML = "<p>暂无数据</p>";
    return;
  }
  const headers = Object.keys(rows[0]);
  document.getElementById(id).innerHTML = `
    <table>
      <thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
      <tbody>
        ${rows.map(r=>`
          <tr>
            ${headers.map(h=>{
              const v = r[h] || "";
              let cls = "";
              if(h.includes("成功率")) cls = rateClass(v);
              if(h === "备注") cls = "bad";
              return `<td class="${cls}">${v}</td>`;
            }).join("")}
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
}

function showTab(e, tab){
  document.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
  e.target.classList.add("active");
  document.getElementById("detailBox").style.display = tab === "detail" ? "block" : "none";
  document.getElementById("alertBox").style.display = tab === "alert" ? "block" : "none";
}

function systemValue(rows, key){
  const item = rows.find(r => r["Key"] === key);
  return item ? item["Value"] : "";
}

async function main(){
  const [summary, detail, alert, system] = await Promise.all([
    loadCSV(SUMMARY_URL),
    loadCSV(DETAIL_URL),
    loadCSV(ALERT_URL),
    loadCSV(SYSTEM_URL)
  ]);

  makeCards(summary);
  makeAlertCards(alert);
  renderTable("detailBox", detail);
  renderTable("alertBox", alert);

  const lastUpdate = systemValue(system, "LastUpdate");
  const platform = systemValue(system, "Platform") || "XX7";
  const status = systemValue(system, "Status") || "OK";

  document.getElementById("lastUpdate").innerText = `Last Update: ${lastUpdate} IST`;
  document.getElementById("status").innerText = `Platform: ${platform} | Status: ${status}`;

  countdown = 60;
}

setInterval(()=>{
  countdown--;
  if(countdown <= 0){
    countdown = 60;
    main();
  }
  document.getElementById("nextRefresh").innerText = `Next Refresh: ${countdown}s`;
},1000);

main();
</script>
</body>
</html>
